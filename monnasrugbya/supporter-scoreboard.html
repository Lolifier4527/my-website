<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Monnas Rugby</title>
<link href="https://fonts.googleapis.com/css2?family=Bebas+Neue&family=DM+Sans:wght@400;600;700&display=swap" rel="stylesheet">
<style>
*, *::before, *::after { box-sizing: border-box; margin: 0; padding: 0; }
:root {
  --gold: #D9B23C;
  --gold-grad: linear-gradient(180deg, #fff6d8 0%, #f0d789 18%, #c99a2e 42%, #8a6414 58%, #eccd7c 76%, #b98a24 100%);
  --bg: #0a152c;
}
html, body {
  height: 100%;
  background: radial-gradient(ellipse 120% 65% at 50% -10%, #16294f 0%, var(--bg) 55%);
  color: #fff;
  font-family: 'DM Sans', sans-serif;
  display: flex; align-items: center; justify-content: center;
  text-align: center;
  padding: 24px;
}
img { width: min(30vw, 30vh, 220px); height: auto; margin-bottom: 24px; filter: drop-shadow(0 6px 18px rgba(0,0,0,0.5)); }
h1 {
  font-family: 'Bebas Neue', sans-serif;
  font-size: clamp(32px, 6vw, 56px);
  letter-spacing: 4px;
  background: var(--gold-grad); -webkit-background-clip: text; background-clip: text; color: transparent;
  margin-bottom: 12px;
}
p { color: rgba(255,255,255,0.65); font-size: clamp(14px, 2vw, 18px); max-width: 420px; margin: 0 auto; }
</style>
</head>
<body>
  <div>
    <img src="monnas_logo.png" alt="Monnas" onerror="this.style.display='none'">
    <h1>TEMPORARILY UNAVAILABLE</h1>
    <p>The Monnas Rugby scoreboard is offline right now. Please check back soon.</p>
  </div>
</body>
</html>
