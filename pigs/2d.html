<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Three Little Pigs</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Andika:wght@400;700&family=Luckiest+Guy&display=swap" rel="stylesheet">
<style>
  :root{
    --bg:#3f8f4a; --panel:#fffaf0; --ink:#3a2a22; --muted:#7a6a5e;
    --accent:#d6487e; --accent-2:#2e9e5b; --warn:#d9534f; --line:#ead9c6; --tint:#fde4ee;
  }
  *{box-sizing:border-box}
  html,body{margin:0}
  body{
    background:linear-gradient(#7cc6f0, #a8dcf5 30%, #5aa95c 62%, #2f6b3a);
    color:var(--ink); font-family:"Andika","Comic Sans MS",system-ui,sans-serif;
    min-height:100vh; display:flex; justify-content:center; padding:16px;
  }
  .wrap{width:100%; max-width:980px}
  h1{font-family:"Luckiest Guy","Andika",cursive; color:#ff9cbc; text-align:center; font-weight:400;
     font-size:clamp(2rem,6vw,3.4rem); margin:.2em 0 .1em; letter-spacing:2px;
     text-shadow:0 3px 0 #7a2848,0 0 14px rgba(255,255,255,.6)}
  .sub{color:#fff; text-align:center; margin:0 0 16px; font-size:1.1rem; font-weight:700; text-shadow:0 1px 3px rgba(0,0,0,.35)}
  .card{background:var(--panel); border-radius:18px; padding:20px; box-shadow:0 10px 30px rgba(0,0,0,.3)}
  .roles{display:grid; grid-template-columns:repeat(auto-fit,minmax(260px,1fr)); gap:14px; margin:14px 0}
  .role{border:2px solid var(--line); border-radius:14px; padding:12px; display:flex; gap:12px; align-items:center; background:#fff}
  .role svg{flex:none; width:70px; height:90px}
  .role label{font-weight:700; display:block}
  .role small{color:var(--muted); display:block; margin-bottom:6px; line-height:1.25}
  .role input{width:100%; font:inherit; font-size:1.05rem; padding:6px 10px; border:2px solid var(--line); border-radius:10px}
  .role input:focus{outline:3px solid #f5b8cf; border-color:var(--accent)}
  .skins{display:flex; gap:6px; margin-top:6px}
  .skins button{width:22px; height:22px; border-radius:50%; border:2px solid #fff; box-shadow:0 0 0 1px #bbb; cursor:pointer; padding:0}
  .skins button[aria-pressed="true"]{box-shadow:0 0 0 3px var(--accent)}
  .btn{font:inherit; font-weight:700; font-size:1.15rem; border:none; border-radius:14px; padding:12px 22px; cursor:pointer;
       background:var(--accent); color:#fff; box-shadow:0 4px 0 #9c2c58; transition:transform .1s}
  .btn:active{transform:translateY(3px); box-shadow:0 1px 0 #9c2c58}
  .btn.green{background:var(--accent-2); box-shadow:0 4px 0 #1d6a3b}
  .btn.ghost{background:var(--tint); color:#b03a68; box-shadow:0 4px 0 #f0bcd0}
  .row{display:flex; gap:10px; flex-wrap:wrap; justify-content:center; align-items:center}
  .note{color:var(--muted); font-size:.95rem; text-align:center; margin-top:10px}

  /* Game */
  #game{display:none}
  .stage{position:relative; width:100%; aspect-ratio:16/9; border-radius:18px 18px 0 0; overflow:hidden; background:#9fd8ff}
  .stage svg{position:absolute; inset:0; width:100%; height:100%}
  .chapter{position:absolute; left:12px; top:10px; background:rgba(45,28,20,.72); color:#fff; padding:4px 12px; border-radius:999px; font-size:.95rem}
  .box{background:var(--panel); border-radius:0 0 18px 18px; padding:14px 18px 18px; min-height:190px; display:flex; flex-direction:column; gap:10px}
  .speaker{font-weight:700; color:var(--accent); font-size:1.15rem; display:flex; justify-content:space-between; align-items:center; gap:8px}
  .speaker.narr{color:var(--muted)}
  .speaker.hint{color:var(--warn)}
  .speaker .tools{display:flex; gap:6px}
  .tool{font:inherit; font-size:.9rem; border:2px solid var(--line); background:#fff; border-radius:10px; padding:3px 10px; cursor:pointer; color:var(--ink)}
  .tool[aria-pressed="true"]{background:var(--tint); border-color:var(--accent)}
  .text{font-size:clamp(1.15rem,2.6vw,1.45rem); line-height:1.5; margin:0; animation:fade .35s ease}
  .choices{display:flex; flex-direction:column; gap:8px}
  .choice{font:inherit; font-size:1.15rem; text-align:left; border:3px solid #f0bcd0; background:#fff; color:var(--ink);
          border-radius:14px; padding:10px 14px; cursor:pointer}
  .choice:hover,.choice:focus{border-color:var(--accent); background:#fff4f8; outline:none}
  .choice.nope{animation:shake .4s; border-color:var(--warn)}
  .next{align-self:flex-end}
  .bob{animation:bob .9s ease-in-out infinite; transform-box:fill-box; transform-origin:bottom center}
  @keyframes bob{50%{transform:translateY(-6px)}}
  @keyframes fade{from{opacity:0; transform:translateY(4px)}}
  @keyframes shake{25%{transform:translateX(-6px)}75%{transform:translateX(6px)}}
  .flicker{animation:flick 1.6s infinite}
  @keyframes flick{50%{opacity:.7}}
  .blink{animation:blink 4s infinite}
  @keyframes blink{0%,94%,100%{opacity:1}96%{opacity:0}}
  .drift{animation:drift 24s ease-in-out infinite alternate}
  @keyframes drift{to{transform:translateX(50px)}}
  .smoke circle{animation:smoke 3s linear infinite; transform-box:fill-box; transform-origin:center}
  @keyframes smoke{from{transform:translate(0,0) scale(.6); opacity:.6} to{transform:translate(14px,-70px) scale(1.8); opacity:0}}
  .float rect{animation:floaty 3s ease-in-out infinite alternate; transform-box:fill-box; transform-origin:center}
  @keyframes floaty{to{transform:translate(20px,-18px) rotate(160deg)}}
  .burst circle{animation:burst 1.3s ease-out forwards; transform-box:fill-box; transform-origin:center}
  @keyframes burst{from{transform:translate(0,0) scale(.4); opacity:.95} to{transform:translate(var(--dx),var(--dy)) scale(2.4); opacity:0}}
  .credits{text-align:center}
  .credits table{margin:12px auto; border-collapse:collapse; font-size:1.2rem}
  .credits td{padding:6px 14px; border-bottom:1px dashed var(--line)}
  .credits td:first-child{color:var(--muted); text-align:right}
  .credits td:last-child{font-weight:700; text-align:left}
  @media (max-width:520px){ body{padding:8px 16px} .box{min-height:220px} }
  .script{border-radius:18px}
  .script h3{margin:20px 0 4px; color:var(--accent)}
  .script h3 small{color:var(--muted); font-weight:400}
  .script table{width:100%; border-collapse:collapse; margin:4px 0 10px}
  .script td{padding:6px 8px; border-bottom:1px solid var(--line); vertical-align:top; line-height:1.4}
  .script td.id{font-family:Consolas,monospace; font-size:.9rem; white-space:nowrap; color:var(--muted)}
  .script td.who{font-weight:700; white-space:nowrap}
  .script .star{color:var(--warn); font-weight:700}
  @media (max-width:600px){
    .script td.id{white-space:normal; word-break:break-all; font-size:.75rem; width:28%}
    .script td.who{white-space:normal}
  }
  @media print{
    body{background:#fff; padding:0; display:block}
    .wrap > *:not(#script){display:none !important}
    #script{box-shadow:none; padding:0}
    .noprint{display:none !important}
    .script tr{break-inside:avoid}
  }
  @media (prefers-reduced-motion: reduce){ .bob,.drift,.smoke circle,.float rect,.flicker{animation:none} }
</style>
</head>
<body>
<div class="wrap">
  <h1>The Three Little Pigs</h1>
  <p class="sub">A huff-and-puff choose-your-path story</p>

  <!-- Setup -->
  <section id="setup" class="card">
    <h2 style="margin:0">Who's in the story?</h2>
    <p style="margin:.3em 0 0">Type a name for each character and pick a colour. Names are saved on this computer only.</p>
    <div class="roles" id="roles"></div>
    <div class="row">
      <button class="btn green" id="startBtn">Start the story ▶</button>
      <button class="btn ghost" id="resetBtn">Reset names</button>
      <button class="btn ghost" id="scriptBtn">🎙 Recording script</button>
    </div>
    <p class="note">Tip: the Big Bad Wolf is the villain, so a teacher's name (or the default) works well for that role.</p>
  </section>

  <!-- Game -->
  <section id="game">
    <div class="stage">
      <svg id="bg" viewBox="0 0 800 450" preserveAspectRatio="xMidYMid slice" aria-hidden="true"></svg>
      <svg id="cast" viewBox="0 0 800 450" preserveAspectRatio="xMidYMid slice" role="img" aria-label="Characters in this scene"></svg>
      <svg id="fx" viewBox="0 0 800 450" preserveAspectRatio="xMidYMid slice" aria-hidden="true"></svg>
      <div class="chapter" id="chapter"></div>
    </div>
    <div class="box">
      <div class="speaker" id="speakerRow">
        <span id="speaker"></span>
        <span class="tools">
          <button class="tool" id="readBtn" title="Read this line aloud">🔊 Read</button>
          <button class="tool" id="autoBtn" aria-pressed="false" title="Read every line aloud">Auto-read</button>
        </span>
      </div>
      <p class="text" id="text"></p>
      <div class="choices" id="choices"></div>
      <button class="btn next" id="nextBtn">Next ▶</button>
    </div>
  </section>

  <!-- Credits -->
  <section id="credits" class="card credits" style="display:none">
    <h2>Starring…</h2>
    <table id="castTable"></table>
    <div class="row">
      <button class="btn green" id="againBtn">Play again</button>
      <button class="btn ghost" id="namesBtn">Change names</button>
    </div>
  </section>

  <!-- Recording script -->
  <section id="script" class="card script" style="display:none">
    <div class="row noprint" style="justify-content:space-between">
      <button class="btn ghost" id="scriptBack">◀ Back</button>
      <button class="btn green" id="printBtn">🖨 Print script</button>
    </div>
    <div id="scriptBody"></div>
  </section>
</div>

<script>
const PALS = {
  skin: ['#ffdbb4','#e8b88a','#c68642','#8d5524','#5c3a21'],
  pig:  ['#f7b8c4','#f29aae','#eda88a','#c98f72','#9c7464'],
};
const ROLES = [
  {key:'pig1',       label:'Little Pig 1',     desc:'Builds with straw. Likes doing things the quick way!', def:'Pip',      pal:'pig',  c:0},
  {key:'pig2',       label:'Little Pig 2',     desc:'Builds with sticks. Loves to play.',                    def:'Penny',    pal:'pig',  c:1},
  {key:'pig3',       label:'Little Pig 3',     desc:'Builds with bricks. Hard-working and clever.',          def:'Percy',    pal:'pig',  c:2},
  {key:'mama',       label:'Mama Pig',         desc:'Kind and wise. Sends her pigs out into the world.',     def:'Mama Pig', pal:'pig',  c:1},
  {key:'wolf',       label:'The Big Bad Wolf', desc:'The villain! Huffs, puffs, and plays sneaky tricks.',   def:'The Big Bad Wolf'},
  {key:'farmer',     label:'The Farmer',       desc:'Sells straw from a cart.',                              def:'Farmer Fran', pal:'skin', c:1},
  {key:'woodcutter', label:'The Woodcutter',   desc:'Sells sticks from the forest.',                         def:'Mr Oak',   pal:'skin', c:3},
  {key:'builder',    label:'The Builder',      desc:'Sells bricks. Knows all about strong houses.',          def:'Builder Bongi', pal:'skin', c:2},
];
let names = {}, skins = {};
function load(){
  ROLES.forEach(r=>{names[r.key]=r.def; skins[r.key]=r.c||0});
  try{
    const saved = JSON.parse(localStorage.getItem('pigs-cast')||'null');
    if(saved){ Object.assign(names, saved.names||{}); Object.assign(skins, saved.skins||{}); }
  }catch(e){}
}
function save(){ try{ localStorage.setItem('pigs-cast', JSON.stringify({names,skins})) }catch(e){} }
const colOf = key => { const r = ROLES.find(r=>r.key===key); return PALS[r.pal][skins[key]] || PALS[r.pal][0]; };
const esc = s => String(s).replace(/[&<>"']/g, c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));
const fill = t => t.replace(/\{(\w+)\}/g, (_,k)=> names[k] ?? k);
const labelOf = who => who==='n' ? 'Story' : who==='hint' ? 'Hmm…' : who==='disguise' ? names.mama+'?' : (names[who] || who);
const scriptLabel = who => who==='disguise' ? `${names.wolf} (pretending to be ${names.mama})` : labelOf(who);

/* ---------- The story (the classic folk tale, retold) ----------
   Each line: [speaker, text, (optional) new cast list, (optional) new background]
   Choices: {t:text, go:sceneId} or {t:text, wrong:hint} */
const SC = {
  intro:{ ch:'Chapter 1 · Time to Go', bg:'home', cast:['pig1','pig2','mama','pig3'], lines:[
    ['n',"Once upon a time, there were three little pigs called {pig1}, {pig2} and {pig3}. They lived on a farm with their mother, {mama}."],
    ['mama',"My little pigs, you are all grown up now. It is time for each of you to build a house of your own."],
    ['pig1',"A house of my very own? Hooray!"],
    ['pig2',"I'm going to have the best house ever!"],
    ['mama',"But be careful. The Big Bad Wolf lives in the forest. Whatever you do, build your house nice and strong."],
    ['pig3',"Don't worry, {mama}. We'll be careful."],
    ['mama',"Before you go, tell me. What kind of house must you build?"],
  ], choices:[
    {t:"A pretty house", wrong:"Pretty is nice, but that's not what {mama} said. Listen again: nice and…"},
    {t:"A STRONG house", go:'road'},
    {t:"A quick house", wrong:"Quick? {mama} said nothing about quick! She said nice and…"},
  ]},
  road:{ ch:'Chapter 2 · Down the Road', bg:'road', cast:['pig1','pig2','pig3','farmer'], lines:[
    ['n',"The three little pigs wave goodbye and set off down the road. Soon they meet {farmer}, with a cart full of straw."],
    ['farmer',"Good morning, little pigs! Would anybody like some straw?"],
    ['pig1',"Straw! It's light, it's easy, and it's quick. I'll build my house with straw!", ['pig1','farmer']],
    ['farmer',"Straw is very quick… but it isn't very strong."],
    ['pig1',"Pfft! I want to finish early so I can play!"],
    ['n',"A little further on, they meet {woodcutter}, carrying a big bundle of sticks.", ['pig2','pig3','woodcutter']],
    ['woodcutter',"Hello there! Fresh sticks from the forest. Who wants some?"],
    ['pig2',"Sticks are stronger than straw, and they're still quick! I'll build my house with sticks!", ['pig2','woodcutter']],
    ['n',"Last of all, {pig3} meets {builder}, next to a big pile of red bricks.", ['pig3','builder']],
    ['builder',"Bricks are heavy, and building with them takes a long time. But nothing is stronger than bricks!"],
    ['n',"What should {pig3} choose?"],
  ], choices:[
    {t:"Straw, so I can play sooner", wrong:"Remember what {mama} said! Is straw strong?"},
    {t:"Sticks, like {pig2}", wrong:"Sticks are better than straw… but are they the STRONGEST?"},
    {t:"Bricks, because they're strong", go:'building'},
  ]},
  building:{ ch:'Chapter 3 · Building Day', bg:'building', cast:['pig1','pig2','pig3'], lines:[
    ['n',"{pig1} builds a little straw house. It takes just one hour!"],
    ['pig1',"Done! Now I can play all day long. La la la!"],
    ['n',"{pig2} builds a little stick house. It takes one whole day."],
    ['pig2',"Done! Hey {pig3}, are you STILL working? Come and play!"],
    ['pig3',"Not yet. Brick by brick, a house gets strong. I'll play when I'm finished."],
    ['n',"{pig3} works for a whole week, lifting brick after brick, until at last the brick house is done."],
    ['pig1',"Ha ha! All that work for a boring old brick house!"],
  ], choices:[{t:"Meanwhile, in the dark forest…", go:'forest'}]},
  forest:{ ch:'Chapter 4 · The Big Bad Wolf', bg:'forest', cast:['wolf'], lines:[
    ['n',"Deep in the dark forest, somebody is very, very hungry."],
    ['wolf',"Sniff, sniff. I smell… PIGS! Lovely, plump little pigs!"],
    ['wolf',"Hee hee hee! I think I'll pay them a little visit."],
  ], choices:[{t:"Follow the wolf…", go:'straw'}]},
  straw:{ ch:'Chapter 5 · The Straw House', bg:'straw', cast:['pig1','wolf'], lines:[
    ['n',"Knock, knock, knock! The wolf knocks on the door of the straw house."],
    ['wolf',"Little pig, little pig, let me come in!"],
    ['pig1',"No, no! Not by the hair on my chinny-chin-chin!"],
    ['wolf',"Then I'll huff, and I'll puff, and I'll BLOW your house in!"],
    ['n',"So he huffed… and he puffed… and WHOOSH! The straw house blows away!", null, 'strawDown'],
    ['pig1',"Help! My house! What do I do now?"],
  ], choices:[
    {t:"Hide under the straw", wrong:"The wolf would find you in a second! Run somewhere safer."},
    {t:"Run to {pig2}'s stick house", go:'sticks'},
  ]},
  sticks:{ ch:'Chapter 6 · The Stick House', bg:'sticks', cast:['pig1','pig2','wolf'], lines:[
    ['n',"{pig1} runs as fast as little legs can go, all the way to the stick house. SLAM! The door shuts just in time."],
    ['wolf',"Little pigs, little pigs, let me come in!"],
    ['pig2',"No, no! Not by the hair on our chinny-chin-chins!"],
    ['wolf',"Then I'll huff, and I'll puff, and I'll BLOW your house in!"],
    ['n',"So he huffed… and he puffed… and WHOOSH! The stick house falls down with a CRASH!", null, 'sticksDown'],
    ['pig2',"Oh no! Where can we go now?"],
  ], choices:[
    {t:"Climb up a tree", wrong:"A wolf can wait under a tree for a very long time! Is there a stronger house nearby?"},
    {t:"Run to {pig3}'s brick house", go:'bricks'},
  ]},
  bricks:{ ch:'Chapter 7 · The Brick House', bg:'bricks', cast:['pig1','pig2','pig3'], lines:[
    ['n',"{pig1} and {pig2} bang on the door of the brick house. {pig3} lets them in, just in time!"],
    ['pig3',"Don't worry. My house is strong. You are safe in here."],
    ['n',"Here comes the wolf, licking his lips.", ['pig1','pig2','pig3','wolf']],
    ['wolf',"Little pigs, little pigs, let me come in!"],
    ['pig3',"No, no! Not by the hair on our chinny-chin-chins!"],
    ['wolf',"Then I'll huff, and I'll puff, and I'll BLOW your house in!"],
    ['n',"So he huffed and he puffed. And he HUFFED and he PUFFED. But the brick house does not move one little bit!"],
    ['wolf',"Puff… pant… wheeze… This house is too strong!"],
  ], choices:[{t:"But the wolf has a sneaky idea…", go:'trick'}]},
  trick:{ ch:'Chapter 8 · A Sneaky Trick', bg:'bricksNight', cast:['wolf:mama'], lines:[
    ['n',"That evening, there is a gentle knock at the door. Tap, tap, tap."],
    ['disguise',"(in a high voice) Yoo-hoo! It's me, {mama}! Open the door, my darlings!"],
    ['pig1',"It's {mama}! Let's open the door!", ['pig1','pig2','pig3','wolf:mama']],
    ['n',"What should the pigs do?"],
  ], choices:[
    {t:"Open the door straight away", wrong:"Wait! Are you sure it's really {mama}? Check first!"},
    {t:"Peep through the window first", go:'peep'},
  ]},
  peep:{ ch:'Chapter 8 · A Sneaky Trick', bg:'bricksNight', cast:['pig3','wolf:mama'], lines:[
    ['n',"{pig3} peeps through the window. There is a flowery hat and a pink shawl… and sticking out at the back, a big, bushy, grey TAIL!"],
    ['pig3',"That's not {mama}! {mama} has a curly little tail. That's the WOLF!"],
    ['wolf',"Grrr! Tricked by a pig! Right. If I can't come in the door, I'll come down the CHIMNEY!", ['pig3','wolf']],
    ['n',"The wolf starts to climb up onto the roof. Scramble, scramble!"],
  ], choices:[{t:"Quick! Make a plan!", go:'plan'}]},
  plan:{ ch:'Chapter 9 · Down the Chimney', bg:'inside', cast:['pig1','pig2','pig3'], lines:[
    ['pig2',"He's on the roof! What do we do?"],
    ['pig3',"We need a big surprise waiting for him at the bottom of the chimney."],
    ['n',"What should they put at the bottom of the chimney?"],
  ], choices:[
    {t:"Hide in the cupboard", wrong:"Hiding won't stop him. He would sniff you out! What could go at the bottom of the chimney?"},
    {t:"Open the front door", wrong:"Never open the door to a wolf! Try again."},
    {t:"A big pot of hot water on the fire", go:'splash'},
  ]},
  splash:{ ch:'Chapter 9 · Down the Chimney', bg:'inside', cast:['pig1','pig2','pig3'], lines:[
    ['n',"{pig3} puts the big pot on the fire. The water bubbles and steams."],
    ['n',"Then… scrabble, scrabble, scrabble… down the chimney comes the wolf and SPLASH! He lands right in the hot water!", ['pig1','pig2','pig3','wolf']],
    ['wolf',"OWWW! OUCH! HOT, HOT, HOT! My tail! My bottom!"],
    ['n',"The wolf shoots back up the chimney like a rocket, runs away over the hills, and is never seen again.", ['pig1','pig2','pig3']],
    ['pig1',"Hooray! {pig3}, you saved us!"],
  ], choices:[{t:"The next morning…", go:'ending'}]},
  ending:{ ch:'Chapter 10 · Happily Ever After', bg:'end', cast:['pig1','mama','pig2','pig3'], lines:[
    ['mama',"My clever little pigs! I am so proud of you."],
    ['pig2',"Sorry we laughed at your brick house, {pig3}."],
    ['pig1',"From now on, I'll take my time and do things properly."],
    ['pig3',"Come on, let's build two more brick houses. We'll all help each other!"],
    ['n',"So with {builder}'s help, they build two more strong brick houses, side by side. And the three little pigs live happily ever after.", ['pig1','pig2','pig3','mama','builder']],
    ['n',"THE END"],
  ], choices:[{t:"See who starred in the story ⭐", go:'#credits'}]},
};


/* ---------- Drawing helpers ---------- */
function mix(a, b, f){
  const p = h => [1,3,5].map(i=>parseInt(h.slice(i,i+2),16)), A = p(a), Bc = p(b);
  return '#' + A.map((v,i)=>Math.round(v+(Bc[i]-v)*f).toString(16).padStart(2,'0')).join('');
}
let seed = 1; const rnd = (a=0,b=1)=>{ seed = (seed*16807) % 2147483647; return a + (seed/2147483647)*(b-a); };

/* ---------- Drawing: characters (feet at 0,0) ---------- */
function face(cy, eye='#222', mouth='smile'){
  const m = mouth==='smile' ? `M-9,${cy+11} Q0,${cy+18} 9,${cy+11}`
          : mouth==='grin'  ? `M-13,${cy+9} Q0,${cy+22} 13,${cy+9}`
          : `M-8,${cy+14} L8,${cy+14}`;
  return `<circle cx="-10" cy="${cy}" r="3.6" fill="${eye}"/><circle cx="10" cy="${cy}" r="3.6" fill="${eye}"/>
          <path d="${m}" stroke="#6b2f24" stroke-width="3" fill="none" stroke-linecap="round"/>`;
}
const PIG_HAT = {
  straw: `<ellipse cx="0" cy="-160" rx="42" ry="8" fill="#e8c65a"/><path d="M-21,-160 C-21,-186 21,-186 21,-160Z" fill="#e8c65a"/><rect x="-21" y="-167" width="42" height="6" fill="#c0392b"/>`,

function strawHouse(){
  let s = `<rect x="-100" y="-130" width="200" height="130" fill="#e5c158"/>`;
  for(let x=-90;x<=90;x+=15) s += `<line x1="${x}" y1="-130" x2="${x}" y2="0" stroke="#c9a33d" stroke-width="2"/>`;
  s += `<path d="M-128,-122 L0,-238 L128,-122Z" fill="#d4ad45"/>`;
  for(let i=-5;i<=5;i++) s += `<line x1="${i*10}" y1="-224" x2="${i*24}" y2="-126" stroke="#bf9a36" stroke-width="2"/>`;
  return s + `<rect x="-22" y="-80" width="44" height="80" rx="4" fill="#8a5a2b"/><rect x="44" y="-104" width="34" height="28" fill="#3a2a1a"/><rect x="-78" y="-104" width="34" height="28" fill="#3a2a1a"/>`;
}

  for(let i=0;i<40;i++){ const x = rnd(-140,140), y = rnd(-36,0), a = rnd(-40,40); s += `<rect x="${x.toFixed(0)}" y="${y.toFixed(0)}" width="${rnd(16,40).toFixed(0)}" height="4" rx="2" fill="${i%2?'#e5c158':'#c9a33d'}" transform="rotate(${a.toFixed(0)} ${x.toFixed(0)} ${y.toFixed(0)})"/>`; }
  return s + `<rect x="50" y="-14" width="70" height="12" rx="2" fill="#8a5a2b" transform="rotate(-8 50 -14)"/>`;
}

      <rect x="540" y="0" width="170" height="345" fill="#8a8178"/><rect x="520" y="200" width="210" height="16" fill="#6e655d"/><rect x="565" y="240" width="120" height="105" fill="#1a100a"/>
      <g class="flicker"><path d="M590,345 Q600,300 612,345Z" fill="#ff7b00"/><path d="M610,345 Q625,290 640,345Z" fill="#ffb92e"/><path d="M636,345 Q648,305 660,345Z" fill="#ff7b00"/></g>
      <path d="M582,280 L668,280 L660,334 L590,334Z" fill="#2a2a2a"/><ellipse cx="625" cy="280" rx="43" ry="8" fill="#9fd7ff"/>
      <g class="smoke" fill="#eef3f5">${[0,1,2].map(i=>`<circle cx="620" cy="272" r="12" style="animation-delay:-${i}s"/>`).join('')}</g>
      <rect x="290" y="110" width="120" height="96" fill="#fff"/><rect x="298" y="118" width="104" height="80" fill="#1b2550"/><circle cx="370" cy="140" r="12" fill="#fff8d0"/><rect x="348" y="118" width="4" height="80" fill="#fff"/>
      <rect x="60" y="110" width="140" height="60" rx="4" fill="#6b4226"/><rect x="68" y="118" width="124" height="44" fill="#fff4e0"/>
      <text x="130" y="146" text-anchor="middle" font-family="Andika,sans-serif" font-weight="700" font-size="16" fill="#b03a68">Home Sweet Home</text>
      <rect x="40" y="290" width="150" height="10" fill="#8a5a2b"/><rect x="50" y="300" width="8" height="50" fill="#6b4226"/><rect x="172" y="300" width="8" height="50" fill="#6b4226"/>
      <ellipse cx="400" cy="420" rx="230" ry="26" fill="#c0587e"/>`,
  end: ()=> meadow() + at(140,345,.55,brickHouse()) + at(400,330,.5,brickHouse()) + at(660,345,.55,brickHouse())
      + `<path d="M30,150 Q400,210 770,150" stroke="#6b4226" stroke-width="2" fill="none"/>`
      + Array.from({length:22},(_,i)=>{ const x = 50+i*33, y = 150+Math.sin((x-30)/740*Math.PI)*42; return `<path d="M${x-10},${y} L${x+10},${y} L${x},${y+20}Z" fill="${['#e85d4a','#ffd34d','#3fa7d6','#2e9e5b','#ff9cbc'][i%5]}"/>`; }).join(''),
};

/* ---------- Engine ---------- */
const $ = id => document.getElementById(id);
let cur, idx, shown, autoRead = false;

function drawCast(speaker){
  const n = shown.length, gap = Math.min(210, 720/Math.max(n,1)), fs = n>5 ? 14 : 17;
  $('cast').innerHTML = shown.map((look,i)=>{
    const role = roleOf(look), x = 400 + (i-(n-1)/2)*gap;
    const talking = role===speaker;
    const name = castName(look);
    const w = Math.min(gap-6, Math.max(64, name.length*fs*.58+22));
    return `<g transform="translate(${x},405)" opacity="${talking||speaker==='n'?1:.85}">
      <g class="${talking?'bob':''}">${LOOK[look]()}</g>
      <rect x="${-w/2}" y="10" width="${w}" height="28" rx="14" fill="${talking?'#d6487e':'rgba(45,28,20,.78)'}"/>
      <text x="0" y="30" text-anchor="middle" font-family="Andika,sans-serif" font-size="${fs}" font-weight="700" fill="#fff"${name.length*fs*.58>w-14 ? ` textLength="${w-14}" lengthAdjust="spacingAndGlyphs"` : ''}>${esc(name)}</text></g>`;
  }).join('');
}
function setBg(key){ $('bg').innerHTML = DEFS + BG[key](); }
function burst(color, x, y, n=26, spread=260){
  const g = document.createElementNS('http://www.w3.org/2000/svg','g'); g.setAttribute('class','burst');
  g.innerHTML = Array.from({length:n},()=>`<circle cx="${x+(Math.random()-.5)*60}" cy="${y+(Math.random()-.5)*40}" r="${8+Math.random()*10}" fill="${color}" style="--dx:${((Math.random()-.5)*spread).toFixed(0)}px;--dy:${(-Math.random()*spread*.6).toFixed(0)}px"/>`).join('');
  $('fx').appendChild(g); setTimeout(()=>g.remove(), 1400);
}

function go(id){
  if(id==='#credits') return showCredits();
  cur = SC[id]; curKey = id; idx = 0; shown = cur.cast.slice(); bgNow = cur.bg;
  setBg(cur.bg);
  $('chapter').textContent = cur.ch;
  showLine();
}
let bgNow = '';
function setBox(who, text){
  const sp = $('speakerRow');
  sp.className = 'speaker' + (who==='n'?' narr':who==='hint'?' hint':'');
  $('speaker').textContent = labelOf(who);
  const t = $('text'); t.textContent = text;
  t.style.animation='none'; void t.offsetWidth; t.style.animation='';
  if(autoRead) speak();
}
function showLine(){
  const [who, text, cast, bg] = cur.lines[idx];
  lineId = curKey + '-' + (idx+1);
  if(cast) shown = cast;
  if(bg && bg!==bgNow){ bgNow = bg; setBg(bg); }
  drawCast(who);
  if(/WHOOSH/.test(text)) burst(bgNow==='sticksDown' ? '#a0703f' : '#f1d36b', 400, 250, 34, 420);
  if(/SPLASH/.test(text)) burst('#e8f4ff', 625, 280, 24, 220);
  setBox(who, fill(text));
  const last = idx === cur.lines.length-1;
  $('nextBtn').style.display = last ? 'none' : '';
  $('choices').innerHTML = '';
  if(last) cur.choices.forEach((c,ci)=>{
    const b = document.createElement('button');
    b.className = 'choice'; b.textContent = fill(c.t);
    b.onclick = ()=>{
      if(c.wrong){ b.classList.remove('nope'); void b.offsetWidth; b.classList.add('nope'); lineId = curKey + '-hint-' + (ci+1); setBox('hint', fill(c.wrong)); }
      else go(c.go);
    };
    $('choices').appendChild(b);
  });
}
function next(){ if(idx < cur.lines.length-1){ idx++; showLine(); } }

// Friendly female narrator: try the nicest-sounding voices first, then any English female voice
const VOICE_PREFS = [/sonia.*natural/i, /libby.*natural/i, /aria.*natural/i, /jenny.*natural/i, /natural.*(female|woman)/i,
  /google uk english female/i, /hazel/i, /susan/i, /zira/i, /samantha/i, /karen/i, /serena/i, /female/i];
let narratorVoice;
function pickVoice(){
  if(narratorVoice) return narratorVoice;
  const vs = speechSynthesis.getVoices().filter(v=>/^en/i.test(v.lang));
  for(const re of VOICE_PREFS){ const v = vs.find(v=>re.test(v.name)); if(v) return narratorVoice = v; }
  return null;
}
let lineId = '', curKey = '', voiceAudio = null;
function stopVoice(){
  if(voiceAudio){ voiceAudio.pause(); voiceAudio = null; }
  if('speechSynthesis' in window) speechSynthesis.cancel();
}
// A recorded file (voice/<line id>.mp3) wins; any line without one is read by the computer voice
function speak(){
  stopVoice();
  if(!lineId) return tts();
  const a = voiceAudio = new Audio('voice/' + lineId + '.mp3');
  let fell = false;
  const fallback = ()=>{ if(!fell && voiceAudio===a){ fell = true; voiceAudio = null; tts(); } };
  a.onerror = fallback; a.play().catch(fallback);
}
function tts(){
  if(!('speechSynthesis' in window)) return;
  const u = new SpeechSynthesisUtterance($('text').textContent.replace(/\([^)]*\)\s*/g,''));
  const v = pickVoice(); if(v){ u.voice = v; u.lang = v.lang; }
  u.pitch = 1.1; u.rate = .9; speechSynthesis.speak(u);
}

function show(which){
  ['setup','game','credits','script'].forEach(s=> $(s).style.display = s===which ? (s==='game'?'block':'') : 'none');
}
function showCredits(){
  stopVoice();
  $('castTable').innerHTML = ROLES.map(r=>`<tr><td>${esc(r.label)}</td><td>${esc(names[r.key])}</td></tr>`).join('');
  show('credits');
}

/* ---------- Recording script (one row per voice file) ---------- */
function buildScript(){
  const row = (id, who, raw) => `<tr><td class="id">${id}.mp3</td><td class="who">${esc(who)}</td><td>${raw.includes('{')?'<span class="star">★</span> ':''}${esc(fill(raw))}</td></tr>`;
  let rows = '', count = 0;
  for(const [key, s] of Object.entries(SC)){
    rows += `<h3>${esc(s.ch)} <small>· ${key}</small></h3><table>`;
    s.lines.forEach((L,i)=>{ rows += row(`${key}-${i+1}`, scriptLabel(L[0]), L[1]); count++; });
    s.choices.forEach((c,i)=>{ if(c.wrong){ rows += row(`${key}-hint-${i+1}`, 'Hint', c.wrong); count++; } });
    rows += '</table>';
  }
  $('scriptBody').innerHTML = `
    <h2 style="margin:.6em 0 .2em">🎙 Recording script — The Three Little Pigs</h2>
    <p>There are <b>${count} lines</b>. Record each one as its own MP3 file, named exactly as shown in the first column (for example <b>intro-1.mp3</b>).
       Put all the files in a folder called <b>voice</b> next to the game. The game plays a recording whenever it finds one, and uses the computer voice for any line that is missing.</p>
    <p><span class="star">★</span> = this line says a character's name. The names shown are the ones typed in right now, so re-record these lines if the names change.</p>
    <p>Tips: record somewhere quiet, keep the phone or microphone the same distance away each time, leave a short pause at the start and end, and read slowly and clearly with lots of expression. The wolf gets to do a big, growly voice!</p>
    ${rows}`;
}
$('scriptBtn').onclick = ()=>{ buildScript(); show('script'); scrollTo(0,0); };
$('scriptBack').onclick = ()=> show('setup');
$('printBtn').onclick = ()=> print();

/* ---------- Setup screen ---------- */
const preview = key => `<svg viewBox="-75 -270 150 285">${LOOK[key]()}</svg>`;
function buildSetup(){
  $('roles').innerHTML = ROLES.map(r=>`
    <div class="role">
      <span id="pv-${r.key}">${preview(r.key)}</span>
      <div style="flex:1">
        <label for="in-${r.key}">${esc(r.label)}</label>
        <small>${esc(r.desc)}</small>
        <input id="in-${r.key}" maxlength="24" value="${esc(names[r.key])}" autocomplete="off">
        ${!r.pal?'':`<div class="skins" role="group" aria-label="${r.pal==='pig'?'Pig colour':'Skin tone'}">${PALS[r.pal].map((c,i)=>`<button style="background:${c}" data-role="${r.key}" data-skin="${i}" aria-label="${r.pal==='pig'?'Pig colour':'Skin tone'} ${i+1}" aria-pressed="${skins[r.key]===i}"></button>`).join('')}</div>`}
      </div>
    </div>`).join('');
  ROLES.forEach(r=> $('in-'+r.key).addEventListener('input', e=>{ names[r.key] = e.target.value.trim() || r.def; save(); }));
  document.querySelectorAll('.skins button').forEach(b=> b.onclick = ()=>{
    const k=b.dataset.role; skins[k]=+b.dataset.skin; save();
    b.parentNode.querySelectorAll('button').forEach(x=>x.setAttribute('aria-pressed', x===b));
    $('pv-'+k).innerHTML = preview(k);
  });
}

$('startBtn').onclick = ()=>{ show('game'); go('intro'); };
$('resetBtn').onclick = ()=>{ try{localStorage.removeItem('pigs-cast')}catch(e){} load(); buildSetup(); };
$('againBtn').onclick = ()=>{ show('game'); go('intro'); };
$('namesBtn').onclick = ()=>{ buildSetup(); show('setup'); };
$('nextBtn').onclick = next;
$('text').onclick = next;
$('readBtn').onclick = speak;
$('autoBtn').onclick = e=>{ autoRead=!autoRead; e.target.setAttribute('aria-pressed', autoRead); if(autoRead) speak(); else stopVoice(); };
document.addEventListener('keydown', e=>{
  if($('game').style.display!=='block' || e.target.tagName==='BUTTON' || e.target.tagName==='INPUT') return;
  if(e.key===' '||e.key==='Enter'||e.key==='ArrowRight'){ e.preventDefault(); next(); }
});

load(); buildSetup(); show('setup');
</script>
